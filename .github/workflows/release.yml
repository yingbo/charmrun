name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the VS Code Marketplace (otherwise build the VSIX only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build VSIX
        run: npm run vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: charmrun-vsix
          path: charmrun.vsix

      - name: Attach VSIX to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: charmrun.vsix
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          inputs.publish
        run: npx vsce publish --packagePath charmrun.vsix --skip-duplicate

      - name: Publish to Open VSX
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          inputs.publish
        run: npx ovsx publish charmrun.vsix --skip-duplicate
