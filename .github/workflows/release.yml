name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the extension registries (otherwise build the VSIX only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build VSIX
        run: npm run vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: charmrun-vsix
          path: charmrun.vsix

      - name: Attach VSIX to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: charmrun.vsix
          generate_release_notes: true

      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium)
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          inputs.publish
        run: npx ovsx publish charmrun.vsix --pat "$OVSX_PAT"

      - name: Publish to VS Code Marketplace
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.publish) &&
          env.VSCE_PAT != ''
        run: npx vsce publish --packagePath charmrun.vsix --pat "$VSCE_PAT"
